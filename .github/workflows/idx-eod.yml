# Cloud schedule paused for local MariaDB cutover. Manual dispatch retained for explicit rollback.
name: IDX Daily EOD
on:
  workflow_dispatch:
    inputs:
      backfill:
        description: Reload up to five years for all active watchlist stocks
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: idx-eod-smdr
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      WANG_SUPABASE_OWNER_ID: ${{ secrets.WANG_SUPABASE_OWNER_ID }}
      BACKFILL: ${{ inputs.backfill }}
      EVENT_NAME: ${{ github.event_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r services/research_api/requirements-eod.txt
      - name: Sync daily prices and verify database readback
        run: |
          python - <<'PY'
          import os,subprocess,sys
          args=[sys.executable,'scripts/sync-idx-eod.py']
          if os.environ.get('BACKFILL')=='true':args.append('--backfill')
          if os.environ.get('EVENT_NAME')=='schedule':args.append('--scheduled')
          raise SystemExit(subprocess.call(args))
          PY
      - name: Sync actual IHSG benchmark and verify readback
        if: always()
        run: python scripts/sync-ihsg.py
