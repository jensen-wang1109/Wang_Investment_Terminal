name: IDX Daily EOD
on:
  schedule:
    - cron: '0 10 * * 1-5' # 17:00 Asia/Jakarta; GitHub may delay scheduled jobs.
  workflow_dispatch:
    inputs:
      backfill:
        description: Reload up to five years for BBCA, SMDR and ADMR
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: idx-eod-smdr
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      WANG_SUPABASE_OWNER_ID: ${{ secrets.WANG_SUPABASE_OWNER_ID }}
      BACKFILL: ${{ inputs.backfill }}
      EVENT_NAME: ${{ github.event_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r services/research_api/requirements-eod.txt
      - name: Sync daily prices and verify database readback
        run: |
          python - <<'PY'
          import os,subprocess,sys
          args=[sys.executable,'scripts/sync-idx-eod.py']
          if os.environ.get('BACKFILL')=='true':args.append('--backfill')
          if os.environ.get('EVENT_NAME')=='schedule':args.append('--scheduled')
          raise SystemExit(subprocess.call(args))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: idx-eod-run-${{ github.run_id }}
          path: .private/research/idx-eod-runs/*.json
          include-hidden-files: true
          retention-days: 7
