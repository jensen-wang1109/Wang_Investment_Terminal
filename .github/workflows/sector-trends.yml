name: Sector Trend Research Monitor
on:
  schedule:
    - cron: '30 0 * * *' # 07:30 WIB, also refresh official macro context.
    - cron: '30 3,6,9,12 * * *' # 10:30 / 13:30 / 16:30 / 19:30 WIB.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sector-research-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      WANG_SUPABASE_OWNER_ID: ${{ secrets.WANG_SUPABASE_OWNER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r services/research_api/requirements-sector.txt openpyxl==3.1.5
      - name: Verify temporal validation and opportunity deduplication
        run: python -m unittest tests.test_sector_trends -v
      - name: Refresh official macro sources; preserve cloud context on failure
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 0 * * *'
        continue-on-error: true
        run: python scripts/fetch-macro.py
      - name: Monitor evidence, train when due, publish only material changes
        run: python scripts/monitor-sector-trends.py
