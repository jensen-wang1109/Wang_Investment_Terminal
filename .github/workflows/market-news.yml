name: Daily Market News
on:
  schedule:
    - cron: '0 0 * * *' # 07:00 Asia/Jakarta every day, including weekends.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: daily-market-news
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      WANG_SUPABASE_OWNER_ID: ${{ secrets.WANG_SUPABASE_OWNER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install certifi==2026.7.22
      - name: Collect market headlines and verify Supabase readback
        run: python scripts/sync-market-news.py
