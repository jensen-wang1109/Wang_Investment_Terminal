# Cloud schedule paused for local MariaDB cutover. Manual dispatch retained for explicit rollback.
name: Daily Market News
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: daily-market-news
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      WANG_SUPABASE_OWNER_ID: ${{ secrets.WANG_SUPABASE_OWNER_ID }}
      NEWS_SCHEDULE: ${{ github.event.schedule }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r services/research_api/requirements-sector.txt -r services/research_api/requirements-reporting.txt pypdf==6.21.1
      - name: Verify analyzer rules and failed-write preservation
        run: python -m unittest tests.test_news_analyzer tests.test_analyzer_pdf -v
      - name: Collect headlines and verify Supabase readback; daily report owned by unified workflow
        run: python scripts/sync-market-news.py --collect-only
