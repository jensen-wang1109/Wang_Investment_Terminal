name: Global Markets and Commodity EOD
on:
  schedule:
    - cron: '0 0 * * 1-6' # 07:00 WIB / 08:00 Perth; US close already passed.
    - cron: '15 10 * * 1-5' # 17:15 WIB / 18:15 Perth; Asian market close.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: global-market-eod
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      WANG_SUPABASE_OWNER_ID: ${{ secrets.WANG_SUPABASE_OWNER_ID }}
      API_NINJAS_KEY: ${{ secrets.API_NINJAS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r services/research_api/requirements-sector.txt
      - name: Validate instrument identity, units and causal safeguards
        run: python -m unittest tests.test_market_data tests.test_shared_intelligence -v
      - name: Collect completed sessions and commodity snapshots; verify database writes
        run: python scripts/refresh-market-data.py
      - name: Refresh the one shared macro-sector context
        if: always()
        run: python scripts/refresh-shared-intelligence.py
